<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Store commission — iORA &amp; The Restyle Trait</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#14161A; --body:#3D434D; --muted:#8A9099; --line:#E4E2DD;
  --paper:#FBFAF8; --card:#FFFFFF;
  --accent:#3A3F45; --soft:#EBECEE; --mid:#B4B8BD; --deep:#23272C; --on:#FFFFFF;
  --low:#A8474F;
  --shadow:0 1px 2px rgba(20,22,26,.05),0 10px 28px -14px rgba(20,22,26,.18);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--paper);color:var(--ink);
  font-family:Archivo,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased}
.num{font-variant-numeric:tabular-nums lining-nums}
.wrap{max-width:1220px;margin:0 auto;padding:0 22px 84px}

/* brand switcher */
.brandbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:22px 0 20px}
.blogo{appearance:none;background:var(--card);border:1.5px solid var(--line);cursor:pointer;
  border-radius:13px;padding:13px 20px;display:flex;flex-direction:column;align-items:flex-start;gap:7px;
  transition:border-color .18s,box-shadow .18s,transform .18s;min-width:132px}
.blogo img{height:26px;width:auto;display:block;opacity:.55;transition:opacity .18s}
.blogo span{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.blogo:hover{transform:translateY(-1px)}
.blogo[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent)}
.blogo[aria-pressed="true"] img{opacity:1}
.blogo[aria-pressed="true"] span{color:var(--accent)}
.blogo:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.spacer{flex:1}
.stamp{font-size:12px;color:var(--muted);align-self:flex-end;padding-bottom:4px}

/* hero */
.hero{display:grid;grid-template-columns:1.02fr .98fr;gap:44px;align-items:end;
  padding:20px 0 42px;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.heroLeft{padding-top:26px}
.markwrap{display:flex;align-items:center;gap:16px;margin-bottom:22px}
.markwrap img{height:46px;width:auto}
.markwrap em{font-style:normal;font-size:13px;font-weight:700;letter-spacing:.03em;
  color:var(--deep);background:var(--soft);padding:6px 13px;border-radius:20px}
h1{font-family:Fraunces,Georgia,serif;font-weight:600;
  font-size:clamp(31px,4.5vw,50px);line-height:1.05;letter-spacing:-.024em;margin:0 0 15px}
.lede{font-size:16px;color:var(--body);margin:0;max-width:44ch}
.bignum{text-align:right;padding-top:26px}
.bignum .v{font-family:Fraunces,Georgia,serif;font-weight:700;
  font-size:clamp(44px,6.6vw,78px);line-height:1;letter-spacing:-.036em;color:var(--deep)}
.bignum .k{font-size:13.5px;color:var(--muted);margin-top:10px}
.spark{margin-top:18px;display:flex;justify-content:flex-end}

/* controls */
.controls{display:flex;flex-wrap:wrap;gap:9px;padding:24px 0 6px}
.seg{display:flex;background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{appearance:none;border:0;background:transparent;cursor:pointer;font:inherit;
  font-size:13px;font-weight:500;color:var(--muted);padding:8px 13px;
  border-right:1px solid var(--line);white-space:nowrap;transition:color .15s,background .15s}
.seg button:last-child{border-right:0}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"]{background:var(--ink);color:#fff}
.seg button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}

/* ledger */
.ledger{display:grid;grid-template-columns:repeat(4,1fr);gap:34px;padding:26px 0 30px;border-bottom:1px solid var(--line)}
.led h2{margin:0 0 9px;font-size:12.5px;font-weight:500;color:var(--muted)}
.led .v{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:28px;letter-spacing:-.02em;line-height:1.1}
.led .n{margin-top:6px;font-size:12.5px;color:var(--muted)}

section{padding:42px 0 0}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:20px}
h3{font-family:Fraunces,Georgia,serif;font-weight:600;font-size:24px;letter-spacing:-.015em;margin:0}
.hint{color:var(--muted);font-size:12.5px;max-width:50ch}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}

/* contribution ribbon */
.ribbonCard{padding:24px 26px 22px}
.ribbon{display:flex;height:56px;border-radius:10px;overflow:hidden;gap:2px;background:var(--line)}
.rseg{position:relative;display:flex;align-items:center;justify-content:center;
  font-size:11.5px;font-weight:700;overflow:hidden;transition:filter .15s}
.rseg:hover{filter:brightness(1.08)}
.rlegend{display:flex;flex-wrap:wrap;gap:6px 20px;margin-top:16px}
.rl{display:flex;align-items:center;gap:8px;font-size:12.5px}
.rl i{width:11px;height:11px;border-radius:3px;flex:0 0 auto}
.rl b{font-weight:600}
.rl span{color:var(--muted)}

/* best / least performing — classic ledger cards */
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
.pc{position:relative;background:var(--card);border:1px solid var(--line);border-radius:4px;
  padding:26px 26px 24px;box-shadow:var(--shadow)}
.pc.lead{border-color:var(--deep)}
.pc .place{display:flex;align-items:baseline;gap:10px;margin-bottom:20px}
.pc .rankno{font-family:Fraunces,Georgia,serif;font-size:34px;font-weight:600;line-height:1;color:var(--mid)}
.pc.lead .rankno{color:var(--accent)}
.pc .placelbl{font-size:11px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
.pc .pcode{font-family:Archivo,sans-serif;font-size:26px;font-weight:700;letter-spacing:.01em;line-height:1.05}
.pc .pname{font-size:13px;color:var(--muted);margin-top:4px;min-height:18px}
.pc .rule{height:1px;background:var(--line);margin:20px 0 16px}
.pc .pval{font-family:Fraunces,Georgia,serif;font-size:30px;font-weight:600;letter-spacing:-.025em;line-height:1;color:var(--deep)}
.pc .plabel{font-size:12px;color:var(--muted);margin-top:6px}
.pc .pmeta{display:flex;gap:22px;margin-top:16px;font-size:12.5px;color:var(--body)}
.pc .pmeta b{font-weight:600}
.pc.least{border-left:3px solid var(--low)}
.pc.least .pval{color:var(--low)}
.pc.least .rankno{color:var(--low);opacity:.4}

/* full table */
.rank{padding:6px 0 6px}
.rrow{display:grid;grid-template-columns:24px minmax(140px,1.4fr) 2fr 108px 56px 92px 62px;
  gap:14px;align-items:center;padding:11px 26px;border-top:1px solid var(--line)}
.rrow.head{border-top:0;font-size:11.5px;color:var(--muted);padding-top:15px;padding-bottom:11px}
.rrow.head button{appearance:none;background:none;border:0;padding:0;font:inherit;color:inherit;cursor:pointer;text-align:inherit;width:100%}
.rrow.head button[data-on="1"]{color:var(--ink);font-weight:600}
.pos{color:var(--muted);font-size:12.5px;text-align:right}
.who b{font-size:14.5px;font-weight:600;display:block}
.who span{color:var(--muted);font-size:12px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.track{height:9px;border-radius:5px;background:#F1EFEB;overflow:hidden}
.track i{display:block;height:100%;border-radius:5px;background:var(--accent)}
.track.nil i{background:#DFC0C3}
.rv,.ro,.rp,.rr{text-align:right;font-size:13.5px}
.rp{color:var(--body)} .rr{color:var(--muted);font-size:12.5px}
.rrow.sum{background:#FAF9F7;font-weight:600;border-top:1.5px solid var(--ink);border-radius:0 0 16px 16px}
.dead b,.dead .rv,.dead .ro{color:var(--low)}

.closed-tag{display:inline-block;font-size:10px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:#9A6B2E;background:#F6ECD9;border-radius:20px;padding:2px 8px;margin-left:8px;vertical-align:1px}
footer{color:var(--muted);font-size:12.5px;border-top:1px solid var(--line);margin-top:52px;padding-top:20px}
footer p{margin:0 0 6px;max-width:78ch}

@media(max-width:900px){
  .hero{grid-template-columns:1fr;gap:24px;align-items:start}
  .bignum{text-align:left;padding-top:0}
  .spark{justify-content:flex-start}
  .ledger{grid-template-columns:1fr 1fr;gap:22px}
  .podium,.watch{grid-template-columns:1fr}
  .pcard.first{padding-top:22px}
  .prow,.mlabels{grid-template-columns:minmax(104px,1fr) 2fr 84px;gap:10px;padding-left:16px;padding-right:16px}
  .prow .po{display:none}
  .rrow{grid-template-columns:22px minmax(100px,1fr) 92px 48px 78px;gap:10px;padding-left:16px;padding-right:16px}
  .rrow .track,.rrow .rr{display:none}
}
@media(prefers-reduced-motion:no-preference){
  .track i,.pbar i{transition:width .3s cubic-bezier(.2,.7,.3,1)}
}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandbar" id="brandbar"></div>

  <div class="hero">
    <div class="heroLeft">
      <div class="markwrap"><img id="heroLogo" alt=""><em id="heroPeriod"></em></div>
      <h1 id="title">Store commission</h1>
      <p class="lede" id="lede"></p>
    </div>
    <div class="bignum">
      <div class="v num" id="heroV">—</div>
      <div class="k" id="heroK"></div>
      <div class="spark" id="spark"></div>
    </div>
  </div>

  <div class="controls">
    <div class="seg" id="yearSeg" role="group" aria-label="Year"></div>
    <div class="seg" id="monthSeg" role="group" aria-label="Month"></div>
  </div>

  <div class="ledger">
    <div class="led"><h2>Commission revenue</h2><div class="v num" id="fRev">—</div></div>
    <div class="led"><h2>Paid to outlets</h2><div class="v num" id="fPay">—</div></div>
    <div class="led"><h2>Orders referred</h2><div class="v num" id="fOrd">—</div><div class="n" id="fOrdN"></div></div>
    <div class="led"><h2>Outlets selling</h2><div class="v num" id="fAct">—</div><div class="n" id="fActN"></div></div>
  </div>

  <section>
    <div class="shead"><h3>Best performing</h3><span class="hint" id="podHint"></span></div>
    <div class="trio" id="podium"></div>
  </section>

  <section>
    <div class="shead"><h3>Least performing</h3><span class="hint" id="watchHint"></span></div>
    <div class="trio" id="watch"></div>
  </section>

  <section>
    <div class="shead"><h3>Outlets performance</h3><span class="hint" id="rankHint"></span></div>
    <div class="card rank" id="rank"></div>
  </section>

  <footer><p id="foot1"></p>
    <p>Commission revenue is the value of orders an outlet referred. Paid to outlets is the incentive they earned on those orders.</p></footer>
</div>

let DATA=null;
function isClosed(code){const c=(DATA.brands[state.brand].closed||[]);return c.indexOf(code)>=0;}
const CLOSED_TAG='<span class="closed-tag">Closed</span>';
const state={brand:"SG",year:"2026",month:"all",sort:"r"};

const money=(v,c)=>c+Math.round(v).toLocaleString("en-US");
const money2=(v,c)=>c+(+v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]));
function mixHex(a,b,t){
  const p=h=>[1,3,5].map(i=>parseInt(h.substr(i,2),16));
  const x=p(a),y=p(b),m=(u,v)=>Math.round(u+(v-u)*t).toString(16).padStart(2,"0");
  return "#"+m(x[0],y[0])+m(x[1],y[1])+m(x[2],y[2]);
}

function boot(d){
  DATA=d;
  const bar=document.getElementById("brandbar");
  Object.keys(d.brands).forEach(k=>{
    const b=document.createElement("button");
    b.className="blogo"; b.dataset.k=k;
    b.innerHTML='<img src="'+(LOGOS[k]||"")+'" alt="'+esc(d.brands[k].name)+'"><span>'+esc(THEME[k].label)+'</span>';
    b.onclick=()=>{state.brand=k;render();};
    bar.appendChild(b);
  });
  const sp=document.createElement("div"); sp.className="spacer"; bar.appendChild(sp);
  const st=document.createElement("div"); st.className="stamp"; st.textContent="Figures to "+d.generated; bar.appendChild(st);
  const ys=document.getElementById("yearSeg");
  ["2025","2026"].forEach(y=>{
    const b=document.createElement("button"); b.textContent=y; b.dataset.y=y;
    b.onclick=()=>{state.year=y;state.month="all";render();}; ys.appendChild(b);
  });
  render();
}

function months(){
  const y=DATA.brands[state.brand].years[state.year]; if(!y)return [];
  const o=[]; for(let i=0;i<12;i++) if(Object.values(y.stores).some(s=>s.r[i]>0||s.o[i]>0)) o.push(i);
  return o;
}
function agg(sel){
  const B=DATA.brands[state.brand], y=B.years[state.year];
  const list=Object.keys(y.stores).map(code=>{
    const s=y.stores[code]; let r=0,o=0,c=0;
    sel.forEach(i=>{r+=s.r[i];o+=s.o[i];c+=s.c[i];});
    return {code:code,name:B.full[code]||"",r:+r.toFixed(2),o:o,c:+c.toFixed(2)};
  });
  return list;
}

function render(){
  const B=DATA.brands[state.brand], cur=B.cur, T=THEME[state.brand], R=document.documentElement.style;
  R.setProperty("--accent",T.a); R.setProperty("--soft",T.soft); R.setProperty("--mid",T.mid);
  R.setProperty("--deep",T.deep); R.setProperty("--on",T.on);
  document.querySelectorAll(".blogo").forEach(b=>b.setAttribute("aria-pressed",b.dataset.k===state.brand));
  document.getElementById("heroLogo").src=LOGOS[state.brand]||"";

  const ms=document.getElementById("monthSeg"); ms.innerHTML="";
  const all=document.createElement("button"); all.textContent="Full year"; all.dataset.m="all";
  all.onclick=()=>{state.month="all";render();}; ms.appendChild(all);
  months().forEach(i=>{
    const b=document.createElement("button"); b.textContent=MN[i]; b.dataset.m=String(i);
    b.onclick=()=>{state.month=String(i);render();}; ms.appendChild(b);
  });
  document.querySelectorAll("#yearSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.y===state.year));
  document.querySelectorAll("#monthSeg button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.m===state.month));

  const sel=state.month==="all"?months():[+state.month];
  const list=agg(sel);
  const tot=list.reduce((a,x)=>a+x.r,0), pay=list.reduce((a,x)=>a+x.c,0), ord=list.reduce((a,x)=>a+x.o,0);
  const active=list.filter(x=>x.r>0).length;
  const per=state.month==="all"?(state.year==="2026"?"January to July "+state.year:state.year):MN[+state.month]+" "+state.year;

  document.getElementById("heroPeriod").textContent=per;
  document.getElementById("lede").textContent=
    "Every online order an outlet referred, what it was worth, and what the outlet earned for it. "
    +B.name+" runs "+list.length+" commission outlets; "+active+" sold this period.";
  document.getElementById("title").textContent=B.name+"\u2019s store commission";
  document.getElementById("heroV").textContent=money(tot,cur);
  document.getElementById("heroK").textContent="commission revenue, "+per;
  document.getElementById("fRev").textContent=money(tot,cur);
  document.getElementById("fPay").textContent=money(pay,cur);
  document.getElementById("fOrd").textContent=ord.toLocaleString("en-US");
  document.getElementById("fOrdN").textContent=ord?money2(tot/ord,cur)+" average":"";
  document.getElementById("fAct").textContent=active+" of "+list.length;
  document.getElementById("fActN").textContent=(list.length-active)+" recorded nothing";

  drawSpark(); drawPodium(list,cur,tot);
  drawWatch(list,cur); drawRank(list,cur,tot,pay,ord);

  document.getElementById("foot1").textContent="Source: ECM store incentive records for "+B.name+
    ". 2026 covers January to July. Figures in "+(cur==="$"?"Singapore dollars":"Malaysian ringgit")+".";
}

function drawSpark(){
  const y=DATA.brands[state.brand].years[state.year], ms=months();
  const vals=ms.map(i=>Object.values(y.stores).reduce((a,s)=>a+s.r[i],0));
  const W=260,H=48,max=Math.max.apply(null,vals.concat([1]));
  const step=vals.length>1?W/(vals.length-1):W;
  const pts=vals.map((v,i)=>[i*step,H-(v/max)*(H-8)-4]);
  const line=pts.map((p,i)=>(i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  const cs=THEME[state.brand].deep, last=pts[pts.length-1];
  document.getElementById("spark").innerHTML=
    '<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="Trend across the period">'
    +'<path d="'+line+' L'+W+' '+H+' L0 '+H+' Z" fill="'+cs+'" opacity=".09"/>'
    +'<path d="'+line+'" fill="none" stroke="'+cs+'" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>'
    +(last?'<circle cx="'+last[0].toFixed(1)+'" cy="'+last[1].toFixed(1)+'" r="3.6" fill="'+cs+'"/>':"")+'</svg>';
}

function drawPodium(list,cur,tot){
  const live=list.filter(x=>x.r>0).sort((a,b)=>b.r-a.r);
  const three=live.slice(0,3);
  const el=document.getElementById("podium");
  if(!three.length){el.innerHTML='<p class="hint">No outlet referred an order in this period.</p>';
    document.getElementById("podHint").textContent="";return;}
  const LB=["First","Second","Third"];
  el.innerHTML=three.map((x,i)=>
    '<div class="pc'+(i===0?" lead":"")+'">'
    +'<div class="place"><span class="rankno num">'+(i+1)+'</span><span class="placelbl">'+LB[i]+'</span></div>'
    +'<div class="pcode">'+esc(x.code)+(isClosed(x.code)?CLOSED_TAG:"")+'</div>'
    +'<div class="pname">'+(x.name?esc(x.name):"&nbsp;")+'</div>'
    +'<div class="rule"></div>'
    +'<div class="pval num">'+money(x.r,cur)+'</div>'
    +'<div class="plabel">commission revenue</div>'
    +'<div class="pmeta"><span><b>'+x.o+'</b> orders</span><span><b>'
      +(tot?(x.r/tot*100).toFixed(1):0)+'%</b> of total</span></div></div>').join("");
  document.getElementById("podHint").textContent=
    "Together they bring in "+(tot?Math.round(three.reduce((a,x)=>a+x.r,0)/tot*100):0)+"% of the commission revenue.";
}

function drawWatch(list,cur){
  const closed=DATA.brands[state.brand].closed||[];
  list=list.filter(x=>!(closed.indexOf(x.code)>=0&&x.r===0&&x.o===0));
  const dead=list.filter(x=>x.r===0).sort((a,b)=>String(a.code).localeCompare(String(b.code)));
  const live=list.filter(x=>x.r>0).sort((a,b)=>a.r-b.r);
  const three=(dead.concat(live)).slice(0,3);
  const el=document.getElementById("watch");
  if(!three.length){el.innerHTML='<p class="hint">Nothing to flag.</p>';
    document.getElementById("watchHint").textContent="";return;}
  el.innerHTML=three.map((x,i)=>
    '<div class="pc least">'
    +'<div class="place"><span class="rankno num">'+(i+1)+'</span><span class="placelbl">Lowest</span></div>'
    +'<div class="pcode">'+esc(x.code)+(isClosed(x.code)?CLOSED_TAG:"")+'</div>'
    +'<div class="pname">'+(x.name?esc(x.name):"&nbsp;")+'</div>'
    +'<div class="rule"></div>'
    +'<div class="pval num">'+(x.r>0?money(x.r,cur):"No orders")+'</div>'
    +'<div class="plabel">'+(x.r>0?"commission revenue":"nothing referred this period")+'</div>'
    +'<div class="pmeta"><span><b>'+x.o+'</b> order'+(x.o===1?"":"s")+'</span></div></div>').join("");
  document.getElementById("watchHint").textContent=dead.length
    ? dead.length+" outlet"+(dead.length>1?"s":"")+" referred nothing at all this period."
    : "The three smallest contributors.";
}

function drawRank(list,cur,tot,pay,ord){
  const k=state.sort;
  const closed=DATA.brands[state.brand].closed||[];
  const shown=list.filter(x=>!(closed.indexOf(x.code)>=0&&x.r===0&&x.o===0));
  const rows=shown.slice().sort((a,b)=>(b[k]||0)-(a[k]||0)||String(a.code).localeCompare(String(b.code)));
  const max=Math.max.apply(null,rows.map(x=>x.r).concat([1]));
  const H=(key,label)=>'<button data-s="'+key+'" data-on="'+(k===key?1:0)+'">'+label+'</button>';
  let h='<div class="rrow head"><div></div><div>'+H("code","Outlet")+'</div><div></div><div class="rv">'
      +H("r","Revenue")+'</div><div class="ro">'+H("o","Orders")+'</div><div class="rp">'
      +H("c","Paid out")+'</div><div class="rr">Rate</div></div>';
  rows.forEach((x,i)=>{
    const rate=x.r?(x.c/x.r*100):null;
    h+='<div class="rrow'+(x.r===0?" dead":"")+'"><div class="pos num">'+(i+1)+'</div>'
      +'<div class="who"><b>'+esc(x.code)+(isClosed(x.code)?CLOSED_TAG:"")+'</b>'+(x.name?"<span>"+esc(x.name)+"</span>":"")+'</div>'
      +'<div class="track'+(x.r===0?" nil":"")+'"><i style="width:'+(x.r>0?Math.max(x.r/max*100,1.5):0)+'%"></i></div>'
      +'<div class="rv num">'+money2(x.r,cur)+'</div><div class="ro num">'+x.o+'</div>'
      +'<div class="rp num">'+money(x.c,cur)+'</div><div class="rr num">'+(rate==null?"—":rate.toFixed(1)+"%")+'</div></div>';
  });
  const sTot=shown.reduce((a,x)=>a+x.r,0),sOrd=shown.reduce((a,x)=>a+x.o,0),sPay=shown.reduce((a,x)=>a+x.c,0);
  h+='<div class="rrow sum"><div></div><div>All outlets</div><div></div><div class="rv num">'+money2(sTot,cur)
    +'</div><div class="ro num">'+sOrd+'</div><div class="rp num">'+money(sPay,cur)
    +'</div><div class="rr num">'+(sTot?(sPay/sTot*100).toFixed(1)+"%":"—")+'</div></div>';
  const el=document.getElementById("rank"); el.innerHTML=h;
  el.querySelectorAll(".head button").forEach(b=>{b.onclick=()=>{state.sort=b.dataset.s;render();};});
  const hid=list.length-shown.length;
  document.getElementById("rankHint").textContent="Ordered by "+
    ({r:"revenue",o:"orders",c:"payout",code:"outlet code"})[k]+". Tap any heading to reorder."+
    (hid?"  \u00b7  "+hid+" closed outlet"+(hid>1?"s":"")+" hidden.":"");
}

fetch("./commission-data.json",{cache:"no-store"})
  .then(r=>{if(!r.ok)throw 0;return r.json();}).then(boot).catch(()=>boot(FALLBACK));
